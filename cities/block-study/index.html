<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4efe4">
    <title>Meridian &amp; Ninth — Chrono City</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/lab/site.css">
    <link rel="stylesheet" href="/cities/block-study/study.css">
  </head>
  <body class="study">
    <header class="study-header">
      <a class="wordmark" href="../../index.html"><i aria-hidden="true"></i> Chrono City</a>
      <a class="text-link" href="../../index.html"><span aria-hidden="true">←</span> Gallery</a>
    </header>
    <main class="study-main">
      <div class="study-heading">
        <h1>Meridian &amp; Ninth</h1>
        <p id="era-name" role="status">1945 · The brick city</p>
      </div>
      <div class="timeline">
        <label for="year">City timeline</label>
        <div class="timeline-track">
          <input id="year" type="range" min="0" max="5" value="0" step="1" aria-valuetext="1945" disabled>
          <div id="year-stops" class="year-stops" role="group" aria-label="Years"></div>
        </div>
      </div>
      <section class="view" aria-label="Interactive city block">
        <div id="scene" role="group" aria-describedby="camera-help" aria-label="3D city camera" tabindex="0"></div>
        <div id="era-transition" aria-hidden="true"></div>
        <p id="view-status" class="view-status" role="status" hidden>Preparing the block…</p>
        <noscript><p class="view-status">Enable JavaScript to explore the 3D block. <a href="../../index.html">Return to the gallery</a>.</p></noscript>
      </section>
      <div class="fieldbar">
        <p id="camera-help">Drag to orbit <span>·</span> Scroll or pinch to zoom <span>·</span> Right-drag or two fingers to pan. Focus the view for arrow keys, Shift + arrows and + / −.</p>
        <div class="view-buttons">
          <button id="street-view" type="button" disabled>Street view</button>
          <button id="reset-view" type="button" disabled>Reset view</button>
          <button id="sound" type="button" aria-pressed="false" disabled><span id="sound-state" aria-hidden="true">○</span> <span>City sound</span> <b id="sound-label">off</b></button>
        </div>
      </div>
    </main>
    <script type="module" src="/cities/block-study/main.js"></script>
  </body>
</html>
